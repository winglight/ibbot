{% extends 'base.html' %}

{% block title %}Optimizer Console{% endblock %}

{% block header_actions %}
<button class="btn" id="btn-refresh">同步</button>
<a class="btn btn-ghost" href="/compare">参数组横评</a>
{% endblock %}

{% block content %}
<section class="opt-card">
    <header class="section-header">
        <div>
            <h2>环境信息</h2>
            <p class="section-subtitle">可用指标与算法</p>
        </div>
        <button class="btn btn-ghost" id="btn-refresh-metadata">刷新</button>
    </header>
    <div class="tag-list" id="metadata-tags">
        <span class="tag">指标加载中...</span>
    </div>
</section>

<section class="opt-card" id="plan-card">
    <header class="section-header">
        <div>
            <h2>优化计划</h2>
            <p class="section-subtitle">管理参数组合遍历与定时报告</p>
        </div>
        <button class="btn" id="btn-new-plan">新增优化计划</button>
    </header>
    <div id="plan-empty-state" class="empty-state">
        暂无计划，请点击“新增优化计划”完成配置。
    </div>
    <div id="plan-table-wrapper" style="display:none;">
        <table class="table" id="plan-table">
            <thead>
                <tr>
                    <th>名称</th>
                    <th>标的</th>
                    <th>算法</th>
                    <th>指标</th>
                    <th>频率</th>
                    <th>状态</th>
                    <th>更新时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</section>

<div id="optimizer-app"></div>
{% endblock %}
