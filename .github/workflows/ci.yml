name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Start application server
        env:
          WEB_HOST: '0.0.0.0'
          WEB_PORT: '8000'
          AUTO_CONNECT: 'false'
          ENABLE_TELEGRAM: 'false'
          ENABLE_WEBSOCKET: 'true'
          ADMIN_USERNAME: 'admin'
          ADMIN_PASSWORD: 'change_me'
          JWT_SECRET: 'ci_secret_change_me'
          JWT_ALGORITHM: 'HS256'
        run: |
          nohup python main.py > server.log 2>&1 &
          echo $! > app.pid

      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -sSf ${API_BASE_URL:-http://127.0.0.1:8000}/ > /dev/null; then
              echo "Server is up"; break; fi; sleep 2; done
        shell: bash
      - name: Show homepage for debugging
        env:
          API_BASE_URL: 'http://127.0.0.1:8000'
        run: |
          sleep 1
          curl -sS "$API_BASE_URL/" || (echo "Server failed to start" && tail -n 200 server.log && exit 1)
        shell: bash

      - name: Run tests
        env:
          API_BASE_URL: 'http://127.0.0.1:8000'
        run: |
          pytest -v -k "not order_fix"

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            server.log

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies for diagnostics
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compose smoke test
        env:
          COMPOSE_PROFILES: ''
        run: |
          ./scripts/deploy.sh up --env local --build

      - name: Tear down stack
        if: always()
        run: |
          ./scripts/deploy.sh down

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs:
      - test
      - compose-smoke
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/ibbot
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}