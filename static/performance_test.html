<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性能测试 - IBBot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="performance_test.js"></script>
    <style>
        .test-card {
            margin-bottom: 20px;
        }
        .result-box {
            height: 300px;
            overflow-y: auto;
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
        }
        .test-btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .log-entry {
            margin-bottom: 5px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .log-time {
            color: #6c757d;
        }
        .log-success {
            color: #198754;
        }
        .log-error {
            color: #dc3545;
        }
        .log-info {
            color: #0d6efd;
        }
        .summary-card {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .progress {
            height: 25px;
        }
        .chart-container {
            height: 300px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>IBBot 性能测试</h1>
        <p class="lead">此页面用于测试接口调用性能和缓存效果</p>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card test-card">
                    <div class="card-header">
                        <h5>图表数据接口测试</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="chartSymbol" class="form-label">合约代码</label>
                            <input type="text" class="form-control" id="chartSymbol" value="AAPL" placeholder="输入合约代码">
                        </div>
                        <div class="mb-3">
                            <label for="chartInterval" class="form-label">时间间隔</label>
                            <select class="form-select" id="chartInterval">
                                <option value="1min">1分钟</option>
                                <option value="5min">5分钟</option>
                                <option value="15min">15分钟</option>
                                <option value="30mins">30分钟</option>
                                <option value="1hour">1小时</option>
                            </select>
                        </div>
                        <div class="d-flex flex-wrap">
                            <button class="btn btn-primary test-btn" onclick="testChartDataApi(1)">测试单次调用</button>
                            <button class="btn btn-warning test-btn" onclick="testChartDataApi(5)">连续调用5次</button>
                            <button class="btn btn-danger test-btn" onclick="testChartDataApi(10)">连续调用10次</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card test-card">
                    <div class="card-header">
                        <h5>订单数据接口测试</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex flex-wrap">
                            <button class="btn btn-primary test-btn" onclick="testOrdersApi(1)">测试单次调用</button>
                            <button class="btn btn-warning test-btn" onclick="testOrdersApi(5)">连续调用5次</button>
                            <button class="btn btn-danger test-btn" onclick="testOrdersApi(10)">连续调用10次</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-3">
            <div class="col-md-6">
                <div class="card summary-card">
                    <div class="card-header">
                        <h5>自动化性能测试</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="testIterations" class="form-label">测试次数</label>
                            <input type="number" class="form-control" id="testIterations" value="5" min="1" max="20">
                        </div>
                        <div class="mb-3">
                            <label for="testInterval" class="form-label">测试间隔 (毫秒)</label>
                            <input type="number" class="form-control" id="testInterval" value="500" min="100" max="5000">
                        </div>
                        <div class="progress mb-3 d-none" id="testProgress">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                        </div>
                        <button class="btn btn-success" onclick="runFullTest()">运行完整测试</button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card summary-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">测试结果摘要</h5>
                    </div>
                    <div class="card-body">
                        <div id="summaryBox">
                            <p class="text-muted">运行测试后将显示结果摘要</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-3">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">测试日志</h5>
                        <button class="btn btn-sm btn-outline-secondary" onclick="clearResults()">清空日志</button>
                    </div>
                    <div class="card-body">
                        <div id="resultBox" class="result-box"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // 测试结果记录
        function logResult(message, type = 'info') {
            const resultBox = document.getElementById('resultBox');
            const now = new Date();
            const timeStr = now.toLocaleTimeString() + '.' + now.getMilliseconds().toString().padStart(3, '0');
            
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `<span class="log-time">[${timeStr}]</span> <span class="log-${type}">${message}</span>`;
            
            resultBox.appendChild(logEntry);
            resultBox.scrollTop = resultBox.scrollHeight;
        }
        
        // 清空测试结果
        function clearResults() {
            document.getElementById('resultBox').innerHTML = '';
            document.getElementById('summaryBox').innerHTML = '<p class="text-muted">运行测试后将显示结果摘要</p>';
        }
        
        // 更新测试进度
        function updateProgress(current, total) {
            const progressBar = document.querySelector('#testProgress .progress-bar');
            const progressContainer = document.getElementById('testProgress');
            
            if (current === 0) {
                progressContainer.classList.remove('d-none');
            }
            
            const percentage = (current / total) * 100;
            progressBar.style.width = `${percentage}%`;
            progressBar.setAttribute('aria-valuenow', percentage);
            
            if (current === total) {
                setTimeout(() => {
                    progressContainer.classList.add('d-none');
                }, 1000);
            }
        }
        
        // 显示测试结果摘要
        function displaySummary(results) {
            const summaryBox = document.getElementById('summaryBox');
            let html = '';
            
            // 计算总体性能提升
            let totalImprovement = 0;
            let testsWithCache = 0;
            
            for (const testName in results) {
                const test = results[testName];
                if (test.cacheAnalysis && test.cacheAnalysis.improvement > 0) {
                    totalImprovement += test.cacheAnalysis.improvement;
                    testsWithCache++;
                }
            }
            
            const avgImprovement = testsWithCache > 0 ? totalImprovement / testsWithCache : 0;
            
            // 显示总体评估
            html += `<div class="alert ${avgImprovement > 50 ? 'alert-success' : (avgImprovement > 20 ? 'alert-info' : 'alert-warning')}">`;
            html += `<h5>总体性能评估</h5>`;
            html += `<p>平均性能提升: <strong>${avgImprovement.toFixed(2)}%</strong></p>`;
            html += `<p>缓存效果: <strong>${avgImprovement > 50 ? '极佳' : (avgImprovement > 20 ? '良好' : '一般')}</strong></p>`;
            html += `</div>`;
            
            // 显示各接口测试结果
            for (const testName in results) {
                const test = results[testName];
                html += `<div class="mb-3">`;
                html += `<h6>${testName}</h6>`;
                html += `<ul class="list-unstyled">`;
                html += `<li>平均响应时间: ${test.avgTime.toFixed(2)}ms</li>`;
                
                if (test.cacheAnalysis) {
                    const cacheEffect = test.cacheAnalysis.improvement > 50 ? '极佳' : 
                                       (test.cacheAnalysis.improvement > 20 ? '良好' : '一般');
                    
                    html += `<li>首次调用: ${test.cacheAnalysis.firstCallTime.toFixed(2)}ms</li>`;
                    html += `<li>后续平均: ${test.cacheAnalysis.avgRemainingTime.toFixed(2)}ms</li>`;
                    html += `<li>性能提升: <span class="${test.cacheAnalysis.improvement > 20 ? 'text-success' : 'text-muted'}">${test.cacheAnalysis.improvement.toFixed(2)}%</span></li>`;
                    html += `<li>缓存效果: <span class="${test.cacheAnalysis.improvement > 20 ? 'text-success' : 'text-muted'}">${cacheEffect}</span></li>`;
                }
                
                html += `</ul>`;
                html += `</div>`;
            }
            
            summaryBox.innerHTML = html;
        }
        
        // 运行完整测试
        async function runFullTest() {
            const iterations = parseInt(document.getElementById('testIterations').value) || 5;
            const interval = parseInt(document.getElementById('testInterval').value) || 500;
            
            // 配置测试参数
            const testConfig = {
                iterations: iterations,
                interval: interval,
                timeout: 30000,
                tests: [
                    {
                        name: 'chart_data接口',
                        endpoint: `/api/chart_data?symbol=${document.getElementById('chartSymbol').value}&interval=${document.getElementById('chartInterval').value}`,
                        description: '测试图表数据接口的缓存效果'
                    },
                    {
                        name: 'orders接口',
                        endpoint: '/api/orders',
                        description: '测试订单数据接口的缓存效果'
                    }
                ]
            };
            
            // 清空之前的结果
            clearResults();
            logResult('开始运行完整性能测试...', 'info');
            logResult(`测试配置: ${iterations}次迭代, ${interval}ms间隔`, 'info');
            
            // 设置控制台输出重定向到页面
            const originalConsoleLog = console.log;
            const originalConsoleError = console.error;
            
            console.log = function(message) {
                if (typeof message === 'string') {
                    logResult(message, 'info');
                } else {
                    logResult(JSON.stringify(message), 'info');
                }
                originalConsoleLog.apply(console, arguments);
            };
            
            console.error = function(message) {
                if (typeof message === 'string') {
                    logResult(message, 'error');
                } else {
                    logResult(JSON.stringify(message), 'error');
                }
                originalConsoleError.apply(console, arguments);
            };
            
            try {
                // 运行测试
                updateProgress(0, testConfig.tests.length * testConfig.iterations);
                let currentProgress = 0;
                
                // 添加进度更新回调
                const originalFetchWithTimeout = window.fetchWithTimeout;
                window.fetchWithTimeout = async function(url, options = {}) {
                    const result = await originalFetchWithTimeout(url, options);
                    currentProgress++;
                    updateProgress(currentProgress, testConfig.tests.length * testConfig.iterations);
                    return result;
                };
                
                const results = await window.runIBBotPerformanceTest(testConfig);
                
                // 恢复原始函数
                window.fetchWithTimeout = originalFetchWithTimeout;
                
                // 显示结果摘要
                displaySummary(results);
                logResult('完整性能测试完成!', 'success');
            } catch (error) {
                logResult(`测试过程中发生错误: ${error.message}`, 'error');
            } finally {
                // 恢复控制台输出
                console.log = originalConsoleLog;
                console.error = originalConsoleError;
            }
        }
        
        // 测试图表数据API
        async function testChartDataApi(times) {
            const symbol = document.getElementById('chartSymbol').value.trim();
            const interval = document.getElementById('chartInterval').value;
            
            if (!symbol) {
                logResult('请输入合约代码', 'error');
                return;
            }
            
            logResult(`开始测试图表数据API (${symbol}, ${interval}), 连续调用${times}次...`, 'info');
            
            const startTime = performance.now();
            const results = [];
            
            for (let i = 0; i < times; i++) {
                try {
                    const callStart = performance.now();
                    const response = await fetch(`/api/chart_data?symbol=${symbol}&interval=${interval}`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    const callEnd = performance.now();
                    const callTime = callEnd - callStart;
                    
                    results.push({
                        callTime,
                        dataPoints: data.length || 0
                    });
                    
                    logResult(`调用 #${i+1}: 耗时 ${callTime.toFixed(2)}ms, 获取 ${data.length || 0} 个数据点`, 
                              callTime < 100 ? 'success' : (callTime < 500 ? 'info' : 'error'));
                } catch (error) {
                    logResult(`调用 #${i+1} 失败: ${error.message}`, 'error');
                    results.push({ callTime: 0, error: error.message });
                }
            }
            
            const endTime = performance.now();
            const totalTime = endTime - startTime;
            const successfulCalls = results.filter(r => !r.error).length;
            
            if (successfulCalls > 0) {
                const avgTime = results.filter(r => !r.error).reduce((sum, r) => sum + r.callTime, 0) / successfulCalls;
                logResult(`测试完成: 总耗时 ${totalTime.toFixed(2)}ms, 平均每次调用 ${avgTime.toFixed(2)}ms`, 'info');
                
                // 分析缓存效果
                if (times > 1 && successfulCalls > 1) {
                    const firstCall = results[0].callTime;
                    const remainingCalls = results.slice(1).filter(r => !r.error);
                    const avgRemainingTime = remainingCalls.reduce((sum, r) => sum + r.callTime, 0) / remainingCalls.length;
                    
                    const improvement = ((firstCall - avgRemainingTime) / firstCall * 100).toFixed(2);
                    if (improvement > 0) {
                        logResult(`缓存效果分析: 首次调用 ${firstCall.toFixed(2)}ms, 后续平均 ${avgRemainingTime.toFixed(2)}ms, 性能提升 ${improvement}%`, 'success');
                    } else {
                        logResult(`缓存效果分析: 未检测到明显的缓存效果`, 'info');
                    }
                }
            } else {
                logResult(`测试完成: 所有调用均失败`, 'error');
            }
        }
        
        // 测试订单数据API
        async function testOrdersApi(times) {
            logResult(`开始测试订单数据API, 连续调用${times}次...`, 'info');
            
            const startTime = performance.now();
            const results = [];
            
            for (let i = 0; i < times; i++) {
                try {
                    const callStart = performance.now();
                    const response = await fetch('/api/orders');
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    const callEnd = performance.now();
                    const callTime = callEnd - callStart;
                    
                    results.push({
                        callTime,
                        ordersCount: data.length || 0
                    });
                    
                    logResult(`调用 #${i+1}: 耗时 ${callTime.toFixed(2)}ms, 获取 ${data.length || 0} 个订单`, 
                              callTime < 100 ? 'success' : (callTime < 500 ? 'info' : 'error'));
                } catch (error) {
                    logResult(`调用 #${i+1} 失败: ${error.message}`, 'error');
                    results.push({ callTime: 0, error: error.message });
                }
            }
            
            const endTime = performance.now();
            const totalTime = endTime - startTime;
            const successfulCalls = results.filter(r => !r.error).length;
            
            if (successfulCalls > 0) {
                const avgTime = results.filter(r => !r.error).reduce((sum, r) => sum + r.callTime, 0) / successfulCalls;
                logResult(`测试完成: 总耗时 ${totalTime.toFixed(2)}ms, 平均每次调用 ${avgTime.toFixed(2)}ms`, 'info');
                
                // 分析缓存效果
                if (times > 1 && successfulCalls > 1) {
                    const firstCall = results[0].callTime;
                    const remainingCalls = results.slice(1).filter(r => !r.error);
                    const avgRemainingTime = remainingCalls.reduce((sum, r) => sum + r.callTime, 0) / remainingCalls.length;
                    
                    const improvement = ((firstCall - avgRemainingTime) / firstCall * 100).toFixed(2);
                    if (improvement > 0) {
                        logResult(`缓存效果分析: 首次调用 ${firstCall.toFixed(2)}ms, 后续平均 ${avgRemainingTime.toFixed(2)}ms, 性能提升 ${improvement}%`, 'success');
                    } else {
                        logResult(`缓存效果分析: 未检测到明显的缓存效果`, 'info');
                    }
                }
            } else {
                logResult(`测试完成: 所有调用均失败`, 'error');
            }
        }
    </script>
</body>
</html>
