version: '3.8'

services:
  # Main IBKR Trading Bot Application
  ibbot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ibbot-main
    ports:
      - "8000:8000"
    environment:
      # Server Configuration
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
      
      # IBKR Configuration  
      - IBKR_HOST=ib-gateway
      - IBKR_PORT=4002
      
      # Mock Configuration
      - MOCK_HOST=mock-gateway
      - MOCK_PORT=18080
      
      # Authentication
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=change_me
      - JWT_SECRET=please_change_me_in_production
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_DAYS=1
      
      # Features
      - AUTO_CONNECT=false
      - ENABLE_TELEGRAM=false
      - ENABLE_WEBSOCKET=true
      
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
      - ../strategy:/app/strategy
    depends_on:
      - ib-gateway
    networks:
      - ibbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://ibbot:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Mock IB Gateway
  mock-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ibbot-mock
    command: ["mock"]
    ports:
      - "18080:18080"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    networks:
      - ibbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/api/connection_status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles: ["mock"]

  # IB Gateway with GUI (noVNC)
  ib-gateway:
    image: jlesage/ib-gateway:latest
    container_name: ib-gateway
    environment:
      - TZ=Asia/Shanghai
      - USER_ID=1000
      - GROUP_ID=1000
      - DISPLAY_WIDTH=1366
      - DISPLAY_HEIGHT=800
      - SECURE_CONNECTION=0
    volumes:
      - ../data/ibgateway:/config:rw
    ports:
      - "4002:4002"   # Paper Trading API
      - "4001:4001"   # Live Trading API (optional)
      - "5800:5800"   # noVNC Web UI (http://localhost:5800)
      - "5900:5900"   # VNC (optional)
    networks:
      - ibbot-network
    restart: unless-stopped

networks:
  ibbot-network:
    driver: bridge

volumes:
  ibbot-logs:
  ibbot-data:
  ibbot-strategy: