name: algo-trader
services:
  # Main IBKR Trading Bot Application
  ibbot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ibbot-main
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - USE_LEGACY=1
      # Server Configuration
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
      
      # IBKR Configuration  
      - IBKR_HOST=ib-gateway
      - IBKR_PORT=4002
      
      # Authentication
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - VISITOR_USERNAME=${VISITOR_USERNAME}
      - VISITOR_PASSWORD=${VISITOR_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_DAYS=1
      
      # Features
      - IBKR_CLIENT_ID=10
      - IBKR_PAPER_TRADING=True
      - AUTO_CONNECT=True
      - IBKR_MARKET_DATA_TYPE=1
      - IBKR_TRY_REALTIME_FALLBACK=False
      # Restart after repeated IBKR connection retries
      - IBKR_MAX_CONNECT_RETRIES=5
      - IBKR_RESTART_DELAY_SEC=1.0
      # Market data service integration
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8010
      - MARKET_DATA_SERVICE_WS_URL=ws://market-data-service:8010/ws/market
      # Risk Management
      - LOSS_THRESHOLD_1=0.05
      - LOSS_THRESHOLD_2=0.10
      - CHECK_INTERVAL=5
      - STOP_LOSS_RATIO=0.025
      - TAKE_PROFIT_RATIO=0.025
      - PRICE_THRESHOLD=0.1
      - LEVERAGE_MNQ=10
      # DOM & Signal Evaluation (optional)
      - DOM_SIGNAL_OUTCOME_DELAY_SECONDS=300
      - DOM_SIGNAL_OUTCOME_THRESHOLD=0.005
      - DOM_CACHE_RETENTION_DAYS=7
      - DOM_AUTOMATION_DEFAULT_INTERVAL_MINUTES=60
      - DOM_AUTOMATION_DEFAULT_LOOKBACK_MINUTES=240
      - DOM_AUTOMATION_DEFAULT_MIN_SIGNALS=20
      - DOM_AUTOMATION_DEFAULT_APPLY_UPDATES=true
      - DOM_AUTOMATION_DEFAULT_SYMBOL=MNQ
      - DOM_AUTOMATION_DEFAULT_LIMIT=500

    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
      - ../src/strategies:/app/src/strategies
    depends_on:
      - ib-gateway
    networks:
      - ibbot-network
      - stack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://ibbot:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optimizer service running optimizer_main.py
  optimizer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ibbot-optimizer
    command: ["python", "optimizer_main.py"]
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    volumes:
      - ../data:/app/data
      - ../src/strategies:/app/src/strategies
    depends_on:
      - ibbot
    networks:
      - ibbot-network
      - stack
    restart: unless-stopped

  market-data-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ibbot-market-data
    command:
      [
        "uvicorn",
        "services.market_data.app:create_app",
        "--host",
        "0.0.0.0",
        "--port",
        "8010",
      ]
    ports:
      - "8010:8010"
    env_file:
      - ./.env
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - MARKET_DATA_SYMBOLS=${MARKET_DATA_SYMBOLS:-MNQ,ES}
      - MARKET_DATA_STREAM_KEY=${MARKET_DATA_STREAM_KEY:-stream:market-data}
      - MARKET_DATA_STREAM_LENGTH=${MARKET_DATA_STREAM_LENGTH:-1000}
      - MARKET_DATA_SERVICE_NAME=${MARKET_DATA_SERVICE_NAME:-market-data-service}
      - MARKET_DATA_SERVICE_VERSION=${MARKET_DATA_SERVICE_VERSION:-}
      - MARKET_DATA_METRICS_PERIOD=${MARKET_DATA_METRICS_PERIOD:-60}
      - MARKET_DATA_ACCOUNT_SNAPSHOT_REFRESH_INTERVAL=${MARKET_DATA_ACCOUNT_SNAPSHOT_REFRESH_INTERVAL:-5}
      - MARKET_DATA_ACCOUNT_SNAPSHOT_RETRY_INTERVAL=${MARKET_DATA_ACCOUNT_SNAPSHOT_RETRY_INTERVAL:-30}
      - MARKET_DATA_ACCOUNT_SNAPSHOT_REQUIRED=${MARKET_DATA_ACCOUNT_SNAPSHOT_REQUIRED:-False}
      - MARKET_DATA_METRICS_INFLUX_URL=${MARKET_DATA_METRICS_INFLUX_URL:-}
      - MARKET_DATA_METRICS_INFLUX_BUCKET=${MARKET_DATA_METRICS_INFLUX_BUCKET:-}
      - MARKET_DATA_METRICS_INFLUX_ORG=${MARKET_DATA_METRICS_INFLUX_ORG:-}
      - MARKET_DATA_METRICS_INFLUX_TOKEN=${MARKET_DATA_METRICS_INFLUX_TOKEN:-}
      - MARKET_DATA_METRICS_MEASUREMENT=${MARKET_DATA_METRICS_MEASUREMENT:-service_metrics}
      - MARKET_DATA_METRICS_INFLUX_TIMEOUT_MS=${MARKET_DATA_METRICS_INFLUX_TIMEOUT_MS:-}
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
    networks:
      - ibbot-network
      - stack
    restart: unless-stopped

  # IB Gateway (gnzsnz)
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:10.39.1h
    container_name: ib-gateway
    restart: always
    env_file:
      - ./.env
    environment:
      - TWS_USERID=${TWS_USERID_PAPER}
      - TWS_PASSWORD=${TWS_PASSWORD_PAPER}
      - TRADING_MODE=${TRADING_MODE:-paper}
      - TWS_SETTINGS_PATH=${TWS_SETTINGS_PATH:-}
      - TWS_ACCEPT_INCOMING=${TWS_ACCEPT_INCOMING:-}
      - READ_ONLY_API=${READ_ONLY_API:-}
      - VNC_SERVER_PASSWORD=${VNC_SERVER_PASSWORD:-}
      - TWOFA_TIMEOUT_ACTION=${TWOFA_TIMEOUT_ACTION:-exit}
      - BYPASS_WARNING=${BYPASS_WARNING:-}
      - AUTO_RESTART_TIME=${AUTO_RESTART_TIME:-}
      - AUTO_LOGOFF_TIME=${AUTO_LOGOFF_TIME:-}
      - TWS_COLD_RESTART=${TWS_COLD_RESTART:-}
      - SAVE_TWS_SETTINGS=${SAVE_TWS_SETTINGS:-}
      - RELOGIN_AFTER_TWOFA_TIMEOUT=${RELOGIN_AFTER_TWOFA_TIMEOUT:-no}
      - TWOFA_EXIT_INTERVAL=${TWOFA_EXIT_INTERVAL:-60}
      - TWOFA_DEVICE=${TWOFA_DEVICE:-}
      - EXISTING_SESSION_DETECTED_ACTION=${EXISTING_SESSION_DETECTED_ACTION:-primary}
      - ALLOW_BLIND_TRADING=${ALLOW_BLIND_TRADING:-no}
      - TIME_ZONE=${TIME_ZONE:-Etc/UTC}
      - TZ=${TIME_ZONE:-Etc/UTC}
      - CUSTOM_CONFIG=${CUSTOM_CONFIG:-NO}
      - JAVA_HEAP_SIZE=${JAVA_HEAP_SIZE:-}
      - SSH_TUNNEL=${SSH_TUNNEL:-}
      - SSH_OPTIONS=${SSH_OPTIONS:-}
      - SSH_ALIVE_INTERVAL=${SSH_ALIVE_INTERVAL:-}
      - SSH_ALIVE_COUNT=${SSH_ALIVE_COUNT:-}
      - SSH_PASSPHRASE=${SSH_PASSPHRASE:-}
      - SSH_REMOTE_PORT=${SSH_REMOTE_PORT:-}
      - SSH_USER_TUNNEL=${SSH_USER_TUNNEL:-}
      - SSH_RESTART=${SSH_RESTART:-}
      - SSH_VNC_PORT=${SSH_VNC_PORT:-}
    ports:
      - "4001:4003"
      - "4002:4004"
      - "5900:5900"
    volumes:
      - ../data/ibgateway:/config:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    networks:
      - ibbot-network
  # Cloudflare Tunnel (cloudflared) - token mode only
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ibbot-cloudflared
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Token-based mode: set CF_TUNNEL_TOKEN in docker/.env
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: ["tunnel", "--no-autoupdate", "run"]
    depends_on:
      - ibbot
    networks:
      - ibbot-network

networks:
  ibbot-network:
    driver: bridge
  stack:
    external: true

volumes:
  ibbot-logs:
  ibbot-data:
  ibbot-strategy: