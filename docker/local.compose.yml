name: ibbot-stack

x-app-env: &app-environment
  env_file:
    - ../.env
  environment:
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_URL: redis://redis:6379/0
    DATA_LAYER_REDIS_URL: redis://redis:6379/0
    IBBOT_DB_URL: ${IBBOT_DB_URL:-mysql+pymysql://${IBBOT_DB_USER:-ibbot}:${IBBOT_DB_PASSWORD:-ibbot-password}@mariadb:3306/${IBBOT_DB_NAME:-ibbot}?charset=utf8mb4}
    DATA_LAYER_DB_URL: ${DATA_LAYER_DB_URL:-mysql+pymysql://${IBBOT_DB_USER:-ibbot}:${IBBOT_DB_PASSWORD:-ibbot-password}@mariadb:3306/${IBBOT_DB_NAME:-ibbot}?charset=utf8mb4}
    IBBOT_DB_USER: ${IBBOT_DB_USER:-ibbot}
    IBBOT_DB_PASSWORD: ${IBBOT_DB_PASSWORD:-ibbot-password}
    IBBOT_DB_NAME: ${IBBOT_DB_NAME:-ibbot}
    MARKET_DATA_SERVICE_URL: http://market-data:8010
    MARKET_DATA_SERVICE_WS_URL: ws://market-data:8010/ws/market
    ACCOUNT_SERVICE_URL: http://account:8020
    ORDERS_SERVICE_URL: http://orders:8050
    RISK_SERVICE_URL: http://risk:8030
    STRATEGY_SERVICE_URL: http://strategy:8045
    NOTIFICATION_SERVICE_URL: http://notification:8055
    NOTIFICATION_SERVICE_TIMEOUT: 10

services:
  redis:
    image: redis:7.2-alpine
    container_name: ibbot-redis
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ibbot-network

  mariadb:
    image: mariadb:11.3
    container_name: ibbot-mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_DATABASE: ${IBBOT_DB_NAME:-ibbot}
      MARIADB_USER: ${IBBOT_DB_USER:-ibbot}
      MARIADB_PASSWORD: ${IBBOT_DB_PASSWORD:-ibbot-password}
      MARIADB_ROOT_PASSWORD: ${IBBOT_DB_ROOT_PASSWORD:-ibbot-root-password}
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./scripts/sql/db.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ibbot-network

  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:10.39.1h
    container_name: ib-gateway
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TWS_USERID: ${TWS_USERID_PAPER}
      TWS_PASSWORD: ${TWS_PASSWORD_PAPER}
      TRADING_MODE: ${TRADING_MODE:-paper}
      TZ: ${TIME_ZONE:-Etc/UTC}
      TIME_ZONE: ${TIME_ZONE:-Etc/UTC}
    ports:
      - "4001:4003"
      - "4002:4004"
      - "5800:5800"
      - "5900:5900"
    volumes:
      - ./data/ibgateway:/config:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_started
    networks:
      - ibbot-network

  ib-command:
    <<: *app-environment
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IBBOT_IMAGE:-ibbot/local}
    command: ["python", "-m", "services.ib_command.main"]
    container_name: ibbot-ib-command
    volumes:
      - ./data/logs:/app/logs
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ibbot-network
    restart: unless-stopped
    profiles:
      - ib-services

  ib-feed:
    <<: *app-environment
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IBBOT_IMAGE:-ibbot/local}
    command: ["python", "-m", "services.ib_feed.main"]
    container_name: ibbot-ib-feed
    volumes:
      - ./data/logs:/app/logs
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      ib-gateway:
        condition: service_started
    networks:
      - ibbot-network
    restart: unless-stopped
    profiles:
      - ib-services

  connection_control:
    <<: *app-environment
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IBBOT_IMAGE:-ibbot/local}
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "services.connection_control.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8056",
      ]
    container_name: ibbot-connection-control
    ports:
      - "8056:8056"
    volumes:
      - ./data/logs:/app/logs
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ibbot-network
    restart: unless-stopped
    profiles:
      - ib-services

  market-data:
    <<: *app-environment
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IBBOT_IMAGE:-ibbot/local}
    command:
      ["python", "-m", "uvicorn", "services.market_data.main:app", "--host", "0.0.0.0", "--port", "8010"]
    container_name: ibbot-market-data
    ports:
      - "8010:8010"
    volumes:
      - ./data/logs:/app/logs
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    networks:
      - ibbot-network
    restart: unless-stopped
    profiles:
      - market

  risk:
    <<: *app-environment
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IBBOT_IMAGE:-ibbot/local}
    command:
      ["python", "-m", "uvicorn", "services.risk.http:app", "--host", "0.0.0.0", "--port", "8030"]
    container_name: ibbot-risk
    ports:
      - "8030:8030"
    volumes:
      - ./data/logs:/app/logs
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    networks:
      - ibbot-network
    restart: unless-stopped
    profiles:
      - risk

  notification:
    <<: *app-environment
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IBBOT_IMAGE:-ibbot/local}
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "services.notification.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8055",
      ]
    container_name: ibbot-notification
    ports:
      - "8055:8055"
    volumes:
      - ./data/logs:/app/logs
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ibbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://notification:8055/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles:
      - notifications

  strategy:
    <<: *app-environment
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IBBOT_IMAGE:-ibbot/local}
    command:
      ["python", "-m", "uvicorn", "services.strategy.http:app", "--host", "0.0.0.0", "--port", "8045"]
    container_name: ibbot-strategy
    ports:
      - "8045:8045"
    volumes:
      - ./data/logs:/app/logs
      - ./data:/app/data
      - ./src/strategies:/app/src/strategies
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ibbot-network
    restart: unless-stopped
    profiles:
      - strategy

  queue-monitor:
    <<: *app-environment
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IBBOT_IMAGE:-ibbot/local}
    command:
      ["python", "-m", "uvicorn", "services.queue_monitor.main:create_app", "--host", "0.0.0.0", "--port", "8011"]
    container_name: ibbot-queue-monitor
    ports:
      - "8011:8011"
    volumes:
      - ./data/logs:/app/logs
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    networks:
      - ibbot-network
    restart: unless-stopped
    profiles:
      - monitoring

  account:
    <<: *app-environment
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IBBOT_IMAGE:-ibbot/local}
    command:
      ["python", "-m", "uvicorn", "services.account.main:app", "--host", "0.0.0.0", "--port", "8020"]
    container_name: ibbot-account
    ports:
      - "8020:8020"
    volumes:
      - ./data/logs:/app/logs
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ibbot-network
    restart: unless-stopped

  orders:
    <<: *app-environment
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IBBOT_IMAGE:-ibbot/local}
    command:
      ["python", "-m", "uvicorn", "services.orders.main:app", "--host", "0.0.0.0", "--port", "8050"]
    container_name: ibbot-orders
    ports:
      - "8050:8050"
    volumes:
      - ./data/logs:/app/logs
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ibbot-network
    restart: unless-stopped

  ibbot:
    <<: *app-environment
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${IBBOT_IMAGE:-ibbot/local}
    container_name: ibbot
    ports:
      - "8000:8000"
    volumes:
      - ./data/logs:/app/logs
      - ./data:/app/data
      - ./src/strategies:/app/src/strategies
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      account:
        condition: service_started
      orders:
        condition: service_started
      risk:
        condition: service_started
      strategy:
        condition: service_started
      notification:
        condition: service_started
      ib-gateway:
        condition: service_started
    networks:
      - ibbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://ibbot:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  optimizer:
    <<: *app-environment
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${OPTIMIZER_IMAGE:-ibbot/optimizer-local}
    command: ["python", "optimizer_main.py"]
    container_name: ibbot-optimizer
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./src/strategies:/app/src/strategies
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      ibbot:
        condition: service_healthy
    networks:
      - ibbot-network
    restart: unless-stopped

  optimizer-ui:
    image: nginx:1.25-alpine
    container_name: ibbot-optimizer-ui
    ports:
      - "4173:80"
    volumes:
      - ./optimizer_ui:/usr/share/nginx/html:ro
    depends_on:
      ibbot:
        condition: service_started
    networks:
      - ibbot-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2024.6.0
    container_name: ibbot-cloudflared
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    command: ["tunnel", "--no-autoupdate", "run"]
    depends_on:
      ibbot:
        condition: service_healthy
    networks:
      - ibbot-network
    profiles:
      - tunnel

networks:
  ibbot-network:
    driver: bridge
