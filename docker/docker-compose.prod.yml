services:
  ib-gateway:
    image: jlesage/ib-gateway:latest
    container_name: ib-gateway
    environment:
      - TZ=Asia/Shanghai
      - USER_ID=1000
      - GROUP_ID=1000
      - DISPLAY_WIDTH=1366
      - DISPLAY_HEIGHT=800
      - SECURE_CONNECTION=0
    volumes:
      - ../data/ibgateway:/config:rw
    ports:
      - "4002:4002"
      - "4001:4001"
      - "5800:5800"   # noVNC Web UI
      - "5900:5900"   # VNC
    networks:
      - ibbot-network
    restart: unless-stopped

  ibbot:
    image: ghcr.io/<owner>/ibbot:v1.0.0  # 生产推荐固定版本；可改为 :latest（如仓库提供）
    container_name: ibbot
    environment:
      # Web 服务
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000

      # IBKR 实盘/纸交易连接（视环境修改）
      - IBKR_HOST=ib-gateway
      - IBKR_PORT=4002
      - ACCOUNT_SERVICE_URL=http://account:8020
      - ORDERS_SERVICE_URL=http://orders:8050
      - RISK_SERVICE_URL=http://risk:8030
      - STRATEGY_SERVICE_URL=http://strategy:8045
      - NOTIFICATION_SERVICE_URL=http://notification:8055
      - NOTIFICATION_SERVICE_TIMEOUT=10

      # 认证与安全（务必覆盖默认值）
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_DAYS=1

      # 功能开关
      - AUTO_CONNECT=false
      - ENABLE_WEBSOCKET=true

    ports:
      - "8000:8000"
    volumes:
      - ../data/logs:/app/logs
      - ../data:/app/data
      - ../strategy:/app/strategy
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - ibbot-network
    depends_on:
      - redis
      - account
      - orders
      - risk
      - strategy
      - notification
      - ib-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ibbot-cloudflared
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    # Token mode only
    command: ["tunnel", "--no-autoupdate", "run"]
    depends_on:
      - ibbot
    networks:
      - ibbot-network

  redis:
    image: redis:7.2-alpine
    container_name: ibbot-redis
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ../data/redis:/data
    networks:
      - ibbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  account:
    image: ghcr.io/<owner>/ibbot:v1.0.0
    container_name: ibbot-account
    env_file:
      - ./.env
    command:
      ["python", "-m", "uvicorn", "services.account.main:app", "--host", "0.0.0.0", "--port", "8020"]
    ports:
      - "8020:8020"
    networks:
      - ibbot-network
    restart: unless-stopped

  orders:
    image: ghcr.io/<owner>/ibbot:v1.0.0
    container_name: ibbot-orders
    env_file:
      - ./.env
    command:
      ["python", "-m", "uvicorn", "services.orders.main:app", "--host", "0.0.0.0", "--port", "8050"]
    ports:
      - "8050:8050"
    networks:
      - ibbot-network
    restart: unless-stopped

  risk:
    image: ghcr.io/<owner>/ibbot:v1.0.0
    container_name: ibbot-risk
    env_file:
      - ./.env
    command:
      ["python", "-m", "uvicorn", "services.risk.http:app", "--host", "0.0.0.0", "--port", "8030"]
    ports:
      - "8030:8030"
    networks:
      - ibbot-network
    restart: unless-stopped

  notification:
    image: ghcr.io/<owner>/ibbot:v1.0.0
    container_name: ibbot-notification
    env_file:
      - ./.env
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "services.notification.main:create_app",
        "--host",
        "0.0.0.0",
        "--port",
        "8055",
      ]
    ports:
      - "8055:8055"
    networks:
      - ibbot-network
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://notification:8055/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  strategy:
    image: ghcr.io/<owner>/ibbot:v1.0.0
    container_name: ibbot-strategy
    env_file:
      - ./.env
    command:
      ["python", "-m", "uvicorn", "services.strategy.http:app", "--host", "0.0.0.0", "--port", "8045"]
    ports:
      - "8045:8045"
    networks:
      - ibbot-network
    restart: unless-stopped

networks:
  ibbot-network:
    driver: bridge
