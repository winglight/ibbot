services:
  redis:
    volumes:
      - ${IBBOT_REDIS_DATA:-/var/lib/ibbot/redis}:/data
  mariadb:
    volumes:
      - ${IBBOT_DB_DATA:-/var/lib/ibbot/mariadb}:/var/lib/mysql
      - ${IBBOT_DB_INIT_SQL:-./scripts/sql/db.sql}:/docker-entrypoint-initdb.d/001-init.sql:ro
  ib-gateway:
    environment:
      TRADING_MODE: ${TRADING_MODE:-live}
    volumes:
      - ${IBBOT_GATEWAY_DATA:-/var/lib/ibbot/ibgateway}:/config:rw
    ports:
      - "${IB_GATEWAY_API_PORT1:-4001}:4003"
      - "${IB_GATEWAY_API_PORT2:-4002}:4004"
      - "${IB_GATEWAY_WEB_PORT:-5800}:5800"
      - "${IB_GATEWAY_VNC_PORT:-5900}:5900"
  ib-command:
    volumes:
      - ${IBBOT_LOGS_DIR:-/var/lib/ibbot/logs}:/app/logs
      - ${IBBOT_DATA_DIR:-/var/lib/ibbot/data}:/app/data
  ib-feed:
    volumes:
      - ${IBBOT_LOGS_DIR:-/var/lib/ibbot/logs}:/app/logs
      - ${IBBOT_DATA_DIR:-/var/lib/ibbot/data}:/app/data
  market-data:
    ports:
      - "${MARKET_DATA_PORT:-8010}:8010"
    volumes:
      - ${IBBOT_LOGS_DIR:-/var/lib/ibbot/logs}:/app/logs
      - ${IBBOT_DATA_DIR:-/var/lib/ibbot/data}:/app/data
  risk:
    volumes:
      - ${IBBOT_LOGS_DIR:-/var/lib/ibbot/logs}:/app/logs
      - ${IBBOT_DATA_DIR:-/var/lib/ibbot/data}:/app/data
  strategy:
    volumes:
      - ${IBBOT_LOGS_DIR:-/var/lib/ibbot/logs}:/app/logs
      - ${IBBOT_DATA_DIR:-/var/lib/ibbot/data}:/app/data
      - ${IBBOT_STRATEGY_DIR:-/var/lib/ibbot/strategies}:/app/src/strategies
  notification:
    volumes:
      - ${IBBOT_LOGS_DIR:-/var/lib/ibbot/logs}:/app/logs
      - ${IBBOT_DATA_DIR:-/var/lib/ibbot/data}:/app/data
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8055}:8055"
  connection_control:
    volumes:
      - ${IBBOT_LOGS_DIR:-/var/lib/ibbot/logs}:/app/logs
      - ${IBBOT_DATA_DIR:-/var/lib/ibbot/data}:/app/data
    ports:
      - "${CONNECTION_CONTROL_PORT:-8056}:8056"
  queue-monitor:
    ports:
      - "${QUEUE_MONITOR_PORT:-8011}:8011"
    volumes:
      - ${IBBOT_LOGS_DIR:-/var/lib/ibbot/logs}:/app/logs
      - ${IBBOT_DATA_DIR:-/var/lib/ibbot/data}:/app/data
  ibbot:
    environment:
      AUTO_CONNECT: ${AUTO_CONNECT:-true}
      IBKR_PAPER_TRADING: ${IBKR_PAPER_TRADING:-False}
      ACCOUNT_SERVICE_URL: http://account:8020
      ORDERS_SERVICE_URL: http://orders:8050
      RISK_SERVICE_URL: http://risk:8030
      STRATEGY_SERVICE_URL: http://strategy:8045
      NOTIFICATION_SERVICE_URL: http://notification:8055
      NOTIFICATION_SERVICE_TIMEOUT: ${NOTIFICATION_SERVICE_TIMEOUT:-10}
    ports:
      - "${IBBOT_WEB_PORT:-8000}:8000"
    volumes:
      - ${IBBOT_LOGS_DIR:-/var/lib/ibbot/logs}:/app/logs
      - ${IBBOT_DATA_DIR:-/var/lib/ibbot/data}:/app/data
      - ${IBBOT_STRATEGY_DIR:-/var/lib/ibbot/strategies}:/app/src/strategies
  optimizer:
    volumes:
      - ${IBBOT_DATA_DIR:-/var/lib/ibbot/data}:/app/data
      - ${IBBOT_STRATEGY_DIR:-/var/lib/ibbot/strategies}:/app/src/strategies
  optimizer-ui:
    ports:
      - "${OPTIMIZER_UI_PORT:-4173}:80"
  cloudflared:
    profiles: null
  account:
    ports:
      - "${ACCOUNT_SERVICE_PORT:-8020}:8020"
    volumes:
      - ${IBBOT_LOGS_DIR:-/var/lib/ibbot/logs}:/app/logs
      - ${IBBOT_DATA_DIR:-/var/lib/ibbot/data}:/app/data

  orders:
    ports:
      - "${ORDERS_SERVICE_PORT:-8050}:8050"
    volumes:
      - ${IBBOT_LOGS_DIR:-/var/lib/ibbot/logs}:/app/logs
      - ${IBBOT_DATA_DIR:-/var/lib/ibbot/data}:/app/data

  risk:
    ports:
      - "${RISK_SERVICE_PORT:-8030}:8030"

  strategy:
    ports:
      - "${STRATEGY_SERVICE_PORT:-8045}:8045"
